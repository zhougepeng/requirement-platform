name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Image version, for example v0.3.36; an existing tag is used when available
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve image version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${RELEASE_TAG:-$REF_NAME}}"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._-]{0,63}$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          image="qpww/requirement-platform"
          {
            echo "tag=$tag"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare exact release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          source_dir=""
          if git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; then
            source_revision="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            source_dir="$(mktemp -d)"
            trap 'rm -rf "${source_dir}"' EXIT
            git archive "refs/tags/${RELEASE_TAG}" | tar -x -C "${source_dir}"
          else
            if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
              echo "::error title=Release tag not found::The remote repository does not contain refs/tags/${RELEASE_TAG}."
              exit 1
            fi
            echo "::warning title=Release tag not found::Manual run will build the current main commit and publish it as ${RELEASE_TAG}. Create a GitHub Release before using this version in production."
            source_revision="$(git rev-parse HEAD)"
          fi
          echo "source_revision=${source_revision}" >> "$GITHUB_OUTPUT"
          dockerfile="${RUNNER_TEMP}/requirement-platform-Dockerfile"
          dockerignore="${RUNNER_TEMP}/requirement-platform-dockerignore"
          if [[ -n "${source_dir}" ]]; then
            cp Dockerfile "${dockerfile}"
            cp .dockerignore "${dockerignore}"
            cp "${dockerfile}" "${source_dir}/Dockerfile"
            cp "${dockerignore}" "${source_dir}/.dockerignore"
            rsync -a --delete --exclude .git/ "${source_dir}/" "${GITHUB_WORKSPACE}/"
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
            NEXT_PUBLIC_BASE_PATH=requirement-platform
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_revision }}
