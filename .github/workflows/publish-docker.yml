name: Publish Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, for example v0.3.35
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow files
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve image version
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          [[ "$tag" =~ ^v[0-9][0-9A-Za-z._-]{0,63}$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            echo "tag=$tag"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare exact release source
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          source_revision="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          echo "source_revision=${source_revision}" >> "$GITHUB_OUTPUT"
          dockerfile="${RUNNER_TEMP}/requirement-platform-Dockerfile"
          dockerignore="${RUNNER_TEMP}/requirement-platform-dockerignore"
          cp Dockerfile "${dockerfile}"
          cp .dockerignore "${dockerignore}"
          source_dir="$(mktemp -d)"
          trap 'rm -rf "${source_dir}"' EXIT
          git archive "refs/tags/${RELEASE_TAG}" | tar -x -C "${source_dir}"
          cp "${dockerfile}" "${source_dir}/Dockerfile"
          cp "${dockerignore}" "${source_dir}/.dockerignore"
          rsync -a --delete --exclude .git/ "${source_dir}/" "${GITHUB_WORKSPACE}/"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.source.outputs.source_revision }}
